<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘서트장 주변 맛집 & 카페 탐색기</title>

  <style>
    /* 기본 스타일 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* 화면을 좌우 분할 구조로 설정 */
    .container {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* 왼쪽 사이드바 디자인 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background-color: #fff;
    }

    h1 {
      font-size: 20px;
      padding: 15px 20px 5px;
      margin: 0;
    }

    /* 콘서트장 탭 버튼 영역 */
    .venue-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 15px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }

    .tab-button {
      flex: 1 1 45%;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-button.active {
      background: #fee500;
      border-color: #fada00;
      color: #000;
    }

    /* 카테고리 필터 버튼 영역 (기능 1) */
    .filter-group {
      display: flex;
      gap: 6px;
      padding: 8px 15px;
      border-bottom: 1px solid #eee;
    }

    .filter-button {
      flex: 1;
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 15px;
      background: #fff;
      cursor: pointer;
    }

    .filter-button.active {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    /* 검색창 영역 */
    .search-box {
      display: flex;
      gap: 8px;
      padding: 10px 15px;
    }

    #keyword {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #searchButton {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }

    /* 상태 표시 메시지 */
    #status {
      padding: 8px 15px;
      font-size: 12px;
      color: #666;
      background: #f9f9f9;
      border-bottom: 1px solid #eee;
    }

    /* 검색 결과 리스트 스크롤 영역 */
    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .place-item {
      padding: 14px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #f5f5f5;
    }

    .place-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .place-address {
      color: #666;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .place-category {
      color: #888;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .place-phone {
      font-size: 12px;
      color: #666;
    }

    .place-link {
      display: inline-block;
      margin-top: 6px;
      color: #1769e0;
      font-size: 12px;
      text-decoration: none;
    }

    .place-link:hover {
      text-decoration: underline;
    }

    /* 오른쪽 지도 영억 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #eee;
    }

    /* 커스텀 인포윈도우 스타일 (기능 2) */
    .info-window {
      padding: 10px;
      font-size: 12px;
      max-width: 220px;
      line-height: 1.4;
    }

    .info-window-title {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .info-window-address {
      color: #555;
      margin-bottom: 6px;
    }

    /* 모바일 반응형 대응 */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 50%;
        min-height: 280px;
      }

      #map {
        height: 50%;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 콘서트장 탭, 검색창, 검색 결과 -->
    <aside class="sidebar">
      <h1>🎵 콘서트장 주변 탐색</h1>

      <!-- 콘서트장 선택 탭 -->
      <div class="venue-tabs">
        <button class="tab-button active" onclick="selectVenue('올림픽 체조경기장', this)">올림픽 체조경기장</button>
        <button class="tab-button" onclick="selectVenue('인스파이어 아레나', this)">인스파이어 아레나</button>
        <button class="tab-button" onclick="selectVenue('고양 종합운동장', this)">고양 종합운동장</button>
        <button class="tab-button" onclick="selectVenue('고척 스카이돔', this)">고척 스카이돔</button>
      </div>

      <!-- 카테고리 필터 (기능 1) -->
      <div class="filter-group">
        <button class="filter-button active" onclick="setCategory('', this)">전체</button>
        <button class="filter-button" onclick="setCategory('FD6', this)">🍔 음식점</button>
        <button class="filter-button" onclick="setCategory('CE7', this)">☕ 카페</button>
      </div>

      <!-- 직접 검색창 -->
      <form id="searchForm" class="search-box">
        <input
          type="text"
          id="keyword"
