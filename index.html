<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘서트장 주변 맛집 & 카페 탐색기</title>

  <style>
    /* 기본 스타일 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* 화면을 좌우 분할 구조로 설정 */
    .container {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* 왼쪽 사이드바 디자인 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background-color: #fff;
    }

    h1 {
      font-size: 20px;
      padding: 15px 20px 5px;
      margin: 0;
    }

    /* 콘서트장 탭 버튼 영역 */
    .venue-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 15px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }

    .tab-button {
      flex: 1 1 45%;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-button.active {
      background: #fee500;
      border-color: #fada00;
      color: #000;
    }

    /* 카테고리 필터 버튼 영역 */
    .filter-group {
      display: flex;
      gap: 6px;
      padding: 8px 15px;
      border-bottom: 1px solid #eee;
    }

    .filter-button {
      flex: 1;
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 15px;
      background: #fff;
      cursor: pointer;
    }

    .filter-button.active {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    /* 검색창 영역 */
    .search-box {
      display: flex;
      gap: 8px;
      padding: 10px 15px;
    }

    #keyword {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #searchButton {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }

    /* 상태 표시 메시지 */
    #status {
      padding: 8px 15px;
      font-size: 12px;
      color: #666;
      background: #f9f9f9;
      border-bottom: 1px solid #eee;
    }

    /* 검색 결과 리스트 스크롤 영역 */
    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .place-item {
      padding: 14px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #f5f5f5;
    }

    .place-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .place-address {
      color: #666;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .place-category {
      color: #888;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .place-phone {
      font-size: 12px;
      color: #666;
    }

    .place-link {
      display: inline-block;
      margin-top: 6px;
      color: #1769e0;
      font-size: 12px;
      text-decoration: none;
    }

    .place-link:hover {
      text-decoration: underline;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #eee;
    }

    /* 커스텀 인포윈도우 스타일 */
    .info-window {
      padding: 10px;
      font-size: 12px;
      max-width: 220px;
      line-height: 1.4;
    }

    .info-window-title {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .info-window-address {
      color: #555;
      margin-bottom: 6px;
    }

    /* 모바일 반응형 대응 */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 50%;
        min-height: 280px;
      }

      #map {
        height: 50%;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 콘서트장 탭, 검색창, 검색 결과 -->
    <aside class="sidebar">
      <h1>🎵 콘서트장 주변 탐색</h1>

      <!-- 콘서트장 선택 탭 -->
      <div class="venue-tabs">
        <button class="tab-button active" onclick="selectVenue('올림픽 체조경기장', this)">올림픽 체조경기장</button>
        <button class="tab-button" onclick="selectVenue('인스파이어 아레나', this)">인스파이어 아레나</button>
        <button class="tab-button" onclick="selectVenue('고양 종합운동장', this)">고양 종합운동장</button>
        <button class="tab-button" onclick="selectVenue('고척 스카이돔', this)">고척 스카이돔</button>
      </div>

      <!-- 카테고리 필터 -->
      <div class="filter-group">
        <button class="filter-button active" onclick="setCategory('', this)">전체</button>
        <button class="filter-button" onclick="setCategory('FD6', this)">🍔 음식점</button>
        <button class="filter-button" onclick="setCategory('CE7', this)">☕ 카페</button>
      </div>

      <!-- 직접 검색창 -->
      <form id="searchForm" class="search-box">
        <input
          type="text"
          id="keyword"
          placeholder="추가 키워드 입력 (예: 맛집, 카페)"
          autocomplete="off"
        >
        <button id="searchButton" type="submit">검색</button>
      </form>

      <!-- 상태 안내 메시지 -->
      <div id="status" role="status">
        지도를 불러오는 중입니다...
      </div>

      <!-- 검색 결과 목록 -->
      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽: 카카오 지도 -->
    <main id="map"></main>

  </div>

  <!-- 핵심 스크립트 작성 -->
  <script>
    // 전역 변수 선언
    let map;
    let placesService;
    let infoWindow;
    let markers = [];

    // 현재 선택된 상태 변수
    let currentVenue = "올림픽 체조경기장";
    let currentCategoryCode = ""; // FD6: 음식점, CE7: 카페

    // HTML 요소 변수
    let keywordInput;
    let searchForm;
    let resultList;
    let statusText;

    // 페이지 로드 완료 시 전역 함수 등록 및 초기화 진행
    window.addEventListener("DOMContentLoaded", function() {
      keywordInput = document.getElementById("keyword");
      searchForm = document.getElementById("searchForm");
      resultList = document.getElementById("resultList");
      statusText = document.getElementById("status");

      if (searchForm) {
        searchForm.addEventListener("submit", function (event) {
          event.preventDefault();
          searchPlaces();
        });
      }
    });

    // 탭 변경 함수 (HTML onclick에서 바로 호출 가능하도록 전역 선언)
    window.selectVenue = function(venueName, element) {
      currentVenue = venueName;
      
      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');

      if (keywordInput) keywordInput.value = "";
      searchPlaces();
    };

    // 카테고리 필터 변경 함수 (HTML onclick에서 바로 호출 가능하도록 전역 선언)
    window.setCategory = function(categoryCode, element) {
      currentCategoryCode = categoryCode;

      const buttons = document.querySelectorAll('.filter-button');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');

      searchPlaces();
    };

    // 카카오 지도 SDK 오류 핸들러
    window.showMapLoadError = function () {
      if (statusText) {
        statusText.textContent = "지도 로딩에 실패했습니다. API 키 및 도메인 설정을 확인해주세요.";
      }
    };

    // 지도 초기화 함수
    function initializeApp() {
      if (!window.kakao || !kakao.maps) {
        showMapLoadError();
        return;
      }

      kakao.maps.load(function () {
        createMap();
      });
    }

    // 지도 및 검색 서비스 생성
    function createMap() {
      const startPosition = new kakao.maps.LatLng(37.5148, 127.1275); // 초기 중심 좌표

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: startPosition,
        level: 4
      });

      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });
      placesService = new kakao.maps.services.Places(map);

      // 지도 준비 완료 후 첫 검색 실행
      searchPlaces();
    }

    // 장소 검색 기능
    function searchPlaces() {
      if (!placesService) return;

      const extraKeyword = keywordInput ? keywordInput.value.trim() : "";
      const searchQuery = extraKeyword ? `${currentVenue} ${extraKeyword}` : `${currentVenue} 근처 음식점`;

      if (statusText) statusText.textContent = `'${searchQuery}' 검색 중...`;
      if (resultList) resultList.replaceChildren();

      removeMarkers();

      const searchOptions = { size: 15 };
      if (currentCategoryCode) {
        searchOptions.category_group_code = currentCategoryCode;
      }

      placesService.keywordSearch(searchQuery, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          displayPlaces(data);
          if (statusText) statusText.textContent = `${currentVenue} 주변 검색 결과 ${data.length}개`;
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
          if (statusText) statusText.textContent = "검색 결과가 없습니다.";
        } else {
          if (statusText) statusText.textContent = "검색 도중 오류가 발생했습니다.";
        }
      }, searchOptions);
    }

    // 검색 결과 및 마커 생성
    function displayPlaces(places) {
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));

        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        markers.push(marker);
        bounds.extend(position);

        const item = document.createElement("div");
        item.className = "place-item";
        item.tabIndex = 0;

        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent = (index + 1) + ". " + place.place_name;
        item.appendChild(name);

        if (place.category_name) {
          const category = document.createElement("div");
          category.className = "place-category";
          category.textContent = place.category_name;
          item.appendChild(category);
        }

        const addressName = place.road_address_name || place.address_name || "주소 정보 없음";
        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent = addressName;
        item.appendChild(address);

        if (place.phone) {
          const phone = document.createElement("div");
          phone.className = "place-phone";
          phone.textContent = place.phone;
          item.appendChild(phone);
        }

        if (place.place_url) {
          const link = document.createElement("a");
          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵 상세 정보 보기 ↗";
          link.addEventListener("click", (e) => e.stopPropagation());
          item.appendChild(link);
        }

        function selectPlace() {
          map.panTo(position);

          const popupContent = `
            <div class="info-window">
              <div class="info-window-title">${escapeHtml(place.place_name)}</div>
              <div class="info-window-address">${escapeHtml(addressName)}</div>
              ${place.place_url ? `<a href="${place.place_url}" target="_blank" style="color:#1769e0; font-size:11px;">상세보기</a>` : ''}
            </div>
          `;

          infoWindow.setContent(popupContent);
          infoWindow.open(map, marker);
        }

        item.addEventListener("click", selectPlace);
        item.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPlace();
          }
        });

        kakao.maps.event.addListener(marker, "click", selectPlace);
        if (resultList) resultList.appendChild(item);
      });

      if (places.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 기존 마커 지우기
    function removeMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });
      markers = [];
      if (infoWindow) infoWindow.close();
    }

    // HTML 이스케이프 함수
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };
        return entities[character];
      });
    }
  </script>

  <!-- 카카오 지도 SDK 로드 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=13211ba064cfe11620d23cf001ba9d76&libraries=services&autoload=false"
    onerror="showMapLoadError()"
    onload="initializeApp()"
  ></script>
</body>
</html>
